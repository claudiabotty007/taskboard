[pytest]
testpaths = tests
# Makes `import taskboard` work without installing the package.
pythonpath = backend-python
# importlib mode lets test files in different folders share a basename.
addopts = -ra --strict-markers --import-mode=importlib
junit_family = xunit2

# Markers are also applied automatically by folder (see tests/conftest.py).
#   pytest -m unit              fast, pure-Python
#   pytest -m "not slow"        skip anything that starts a server process
#   pytest -m contract --backend all
markers =
    unit: pure-Python tests of the store/business logic (no HTTP)
    api: Flask test-client tests of the Python backend (no real socket)
    contract: black-box HTTP tests against a live backend; select it with --backend
    slow: starts processes or otherwise takes noticeably longer
